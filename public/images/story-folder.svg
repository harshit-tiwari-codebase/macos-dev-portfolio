<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Story folder</title>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A5BFF"/>
      <stop offset="1" stop-color="#2231C9"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A79FF"/>
      <stop offset="0.55" stop-color="#2B3EF2"/>
      <stop offset="1" stop-color="#1F2FD0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3E7F0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="-3" stdDeviation="5" flood-color="#12161D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="256" cy="448" rx="190" ry="20" fill="#12161D" opacity="0.28" filter="url(#shadow)"/>

  <!-- back panel with tab -->
  <path d="M76 96 H196 C206 96 214 100 221 107 L243 129 C250 136 258 140 268 140 H436 C451.500 140 464 152.500 464 168 V396 C464 411.500 451.500 424 436 424 H76 C60.500 424 48 411.500 48 396 V124 C48 108.500 60.500 96 76 96 Z" fill="url(#back)"/>

  <!-- pages peeking out -->
  <rect x="82" y="128" width="348" height="190" rx="14" fill="#CBD1E6" transform="rotate(-2.500 256 223)"/>
  <rect x="76" y="136" width="360" height="190" rx="14" fill="url(#paper)" transform="rotate(1.500 256 231)"/>
  <rect x="112" y="166" width="150" height="9" rx="4.500" fill="#12161D" opacity="0.14" transform="rotate(1.500 256 231)"/>
  <rect x="112" y="190" width="220" height="7" rx="3.500" fill="#12161D" opacity="0.08" transform="rotate(1.500 256 231)"/>

  <!-- front panel -->
  <g filter="url(#soft)">
    <path d="M48 204 C48 188.500 60.500 176 76 176 H436 C451.500 176 464 188.500 464 204 V396 C464 411.500 451.500 424 436 424 H76 C60.500 424 48 411.500 48 396 Z" fill="url(#front)"/>
  </g>
  <!-- top edge highlight -->
  <path d="M76 177.500 H436 C449 177.500 460 186 462.500 198" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>

  <!-- the story path: unlit track, lit progress, nodes, head -->
  <path d="M104 372 C150 372 164 300 210 300 C262 300 280 330 330 330 C372 330 380 262 408 262" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="9" stroke-linecap="round"/>
  <path d="M104 372 C150 372 164 300 210 300 C262 300 280 330 330 330" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>

  <circle cx="104" cy="372" r="12" fill="#FFFFFF"/>
  <circle cx="210" cy="300" r="12" fill="#FFFFFF"/>
  <circle cx="330" cy="330" r="12" fill="#FFFFFF"/>

  <circle cx="408" cy="262" r="12" fill="#2B3EF2" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.55"/>
  <circle cx="408" cy="262" r="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
