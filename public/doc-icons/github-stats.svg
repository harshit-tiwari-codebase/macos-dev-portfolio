<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D333B"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="barOrange" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#D29922"/>
      <stop offset="100%" stop-color="#E3B341"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bg)"/>
  <rect x="30" y="30" width="452" height="452" rx="106" fill="none" stroke="#30363D" stroke-width="2"/>
  <!-- Top sheen -->
  <rect x="60" y="30" width="392" height="100" rx="55" fill="white" opacity="0.03"/>

  <!-- Contribution grid (7 cols × 5 rows, authentic GitHub) -->
  <g transform="translate(80, 88)">
    <!-- Row 0 -->
    <rect x="0"   y="0" width="38" height="38" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.5"/>
    <rect x="52"  y="0" width="38" height="38" rx="8" fill="#0E4429"/>
    <rect x="104" y="0" width="38" height="38" rx="8" fill="#006D32"/>
    <rect x="156" y="0" width="38" height="38" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.5"/>
    <rect x="208" y="0" width="38" height="38" rx="8" fill="#26A641"/>
    <rect x="260" y="0" width="38" height="38" rx="8" fill="#0E4429"/>
    <rect x="312" y="0" width="38" height="38" rx="8" fill="#39D353"/>
    <!-- Row 1 -->
    <rect x="0"   y="48" width="38" height="38" rx="8" fill="#006D32"/>
    <rect x="52"  y="48" width="38" height="38" rx="8" fill="#39D353"/>
    <rect x="104" y="48" width="38" height="38" rx="8" fill="#26A641"/>
    <rect x="156" y="48" width="38" height="38" rx="8" fill="#0E4429"/>
    <rect x="208" y="48" width="38" height="38" rx="8" fill="#39D353"/>
    <rect x="260" y="48" width="38" height="38" rx="8" fill="#006D32"/>
    <rect x="312" y="48" width="38" height="38" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.5"/>
    <!-- Row 2 -->
    <rect x="0"   y="96" width="38" height="38" rx="8" fill="#0E4429"/>
    <rect x="52"  y="96" width="38" height="38" rx="8" fill="#006D32"/>
    <rect x="104" y="96" width="38" height="38" rx="8" fill="#39D353"/>
    <rect x="156" y="96" width="38" height="38" rx="8" fill="#39D353"/>
    <rect x="208" y="96" width="38" height="38" rx="8" fill="#006D32"/>
    <rect x="260" y="96" width="38" height="38" rx="8" fill="#26A641"/>
    <rect x="312" y="96" width="38" height="38" rx="8" fill="#0E4429"/>
    <!-- Row 3 -->
    <rect x="0"   y="144" width="38" height="38" rx="8" fill="#26A641"/>
    <rect x="52"  y="144" width="38" height="38" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.5"/>
    <rect x="104" y="144" width="38" height="38" rx="8" fill="#0E4429"/>
    <rect x="156" y="144" width="38" height="38" rx="8" fill="#26A641"/>
    <rect x="208" y="144" width="38" height="38" rx="8" fill="#39D353"/>
    <rect x="260" y="144" width="38" height="38" rx="8" fill="#39D353"/>
    <rect x="312" y="144" width="38" height="38" rx="8" fill="#006D32"/>
  </g>

  <!-- Stats bars at bottom -->
  <g transform="translate(80, 318)">
    <!-- Bar chart -->
    <rect x="0"   y="70"  width="48" height="82" rx="8" fill="url(#barGreen)"/>
    <rect x="66"  y="36"  width="48" height="116" rx="8" fill="url(#barBlue)"/>
    <rect x="132" y="12"  width="48" height="140" rx="8" fill="url(#barGreen)"/>
    <rect x="198" y="52"  width="48" height="100" rx="8" fill="url(#barPurple)"/>
    <rect x="264" y="28"  width="48" height="124" rx="8" fill="url(#barOrange)"/>
    <rect x="316" y="58"  width="48" height="94" rx="8" fill="url(#barBlue)" opacity="0.7"/>

    <!-- Trend line -->
    <polyline points="24,62 90,30 156,6 222,44 288,20 340,50"
      fill="none" stroke="white" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Trend dots -->
    <circle cx="24"  cy="62" r="4" fill="white" opacity="0.5"/>
    <circle cx="90"  cy="30" r="4" fill="white" opacity="0.5"/>
    <circle cx="156" cy="6"  r="4" fill="white" opacity="0.5"/>
    <circle cx="222" cy="44" r="4" fill="white" opacity="0.5"/>
    <circle cx="288" cy="20" r="4" fill="white" opacity="0.5"/>
    <circle cx="340" cy="50" r="4" fill="white" opacity="0.5"/>
  </g>
</svg>
