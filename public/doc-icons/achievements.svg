<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium dark obsidian & gold ambient background -->
    <linearGradient id="achBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C1D08"/>
      <stop offset="35%" stop-color="#1A1205"/>
      <stop offset="70%" stop-color="#0E0A03"/>
      <stop offset="100%" stop-color="#050301"/>
    </linearGradient>

    <!-- Warm golden radial glow -->
    <radialGradient id="goldAura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Multi-stop Liquid 24k Gold Gradients -->
    <linearGradient id="gold24k" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="18%" stop-color="#FDE68A"/>
      <stop offset="42%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <linearGradient id="goldReflect" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="65%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="cupSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#B45309" stop-opacity="0"/>
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="podiumGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B2E18"/>
      <stop offset="40%" stop-color="#23190A"/>
      <stop offset="100%" stop-color="#140D04"/>
    </linearGradient>

    <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- macOS Squircle Container -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#achBg)"/>
  <!-- Ambient Gold Atmosphere -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#goldAura)"/>
  <!-- Metallic Edge Rim -->
  <rect x="30" y="30" width="452" height="452" rx="106" fill="none" stroke="url(#goldRim)" stroke-width="2.5"/>

  <!-- Top Glass Highlight Specular -->
  <path d="M60 32 Q256 50 452 32 C462 48 468 68 472 90 C340 135 172 135 40 90 C44 68 50 48 60 32 Z" fill="white" opacity="0.08"/>

  <!-- Laurel Wreath (Apple Game Center / Awards style) -->
  <g fill="none" stroke="url(#goldReflect)" stroke-width="3" opacity="0.45">
    <!-- Left Branch -->
    <path d="M120 280 C110 200 140 130 185 95" stroke-linecap="round"/>
    <ellipse cx="140" cy="135" rx="12" ry="6" transform="rotate(-35 140 135)" fill="#F59E0B" fill-opacity="0.4"/>
    <ellipse cx="125" cy="180" rx="13" ry="6" transform="rotate(-15 125 180)" fill="#F59E0B" fill-opacity="0.4"/>
    <ellipse cx="120" cy="230" rx="13" ry="6" transform="rotate(10 120 230)" fill="#F59E0B" fill-opacity="0.4"/>
    <ellipse cx="132" cy="275" rx="12" ry="6" transform="rotate(30 132 275)" fill="#F59E0B" fill-opacity="0.4"/>

    <!-- Right Branch -->
    <path d="M392 280 C402 200 372 130 327 95" stroke-linecap="round"/>
    <ellipse cx="372" cy="135" rx="12" ry="6" transform="rotate(35 372 135)" fill="#F59E0B" fill-opacity="0.4"/>
    <ellipse cx="387" cy="180" rx="13" ry="6" transform="rotate(15 387 180)" fill="#F59E0B" fill-opacity="0.4"/>
    <ellipse cx="392" cy="230" rx="13" ry="6" transform="rotate(-10 392 230)" fill="#F59E0B" fill-opacity="0.4"/>
    <ellipse cx="380" cy="275" rx="12" ry="6" transform="rotate(-30 380 275)" fill="#F59E0B" fill-opacity="0.4"/>
  </g>

  <!-- 3D Trophy Handles -->
  <!-- Left Handle -->
  <path d="M166 160 C115 160 102 225 150 252 C168 262 178 250 176 238 C174 226 130 226 134 186 C137 165 158 174 166 174 Z"
        fill="url(#goldReflect)"/>
  <path d="M166 160 C115 160 102 225 150 252" fill="none" stroke="#FFFBEB" stroke-width="2" opacity="0.6"/>

  <!-- Right Handle -->
  <path d="M346 160 C397 160 410 225 362 252 C344 262 334 250 336 238 C338 226 382 226 378 186 C375 165 354 174 346 174 Z"
        fill="url(#goldReflect)"/>
  <path d="M346 160 C397 160 410 225 362 252" fill="none" stroke="#FFFBEB" stroke-width="2" opacity="0.6"/>

  <!-- Trophy Cup Body (3D Gold Vase) -->
  <path d="M164 125 Q256 138 348 125 L346 210 C346 278 298 318 256 318 C214 318 166 278 166 210 Z"
        fill="url(#gold24k)"/>
  <!-- Specular Overlay on Cup -->
  <path d="M164 125 Q256 138 348 125 L346 210 C346 278 298 318 256 318 C214 318 166 278 166 210 Z"
        fill="url(#cupSheen)"/>

  <!-- Top Rim of Cup with 3D Depth -->
  <ellipse cx="256" cy="125" rx="92" ry="14" fill="#FDE68A"/>
  <ellipse cx="256" cy="125" rx="84" ry="10" fill="#78350F"/>
  <ellipse cx="256" cy="125" rx="80" ry="8" fill="#451A03"/>

  <!-- Embossed Star in Center of Cup -->
  <g transform="translate(256, 212)">
    <!-- Star Glow -->
    <circle cx="0" cy="0" r="32" fill="#FEF3C7" opacity="0.2"/>
    <!-- 3D Beveled Star Facets -->
    <polygon points="0,-36 9,-11 36,-11 14,5 22,30 0,14 -22,30 -14,5 -36,-11 -9,-11" fill="#FFFBEB"/>
    <polygon points="0,-36 9,-11 0,14" fill="#FCD34D"/>
    <polygon points="36,-11 14,5 0,14" fill="#F59E0B"/>
    <polygon points="22,30 0,14 0,14" fill="#D97706"/>
    <polygon points="-22,30 -14,5 0,14" fill="#B45309"/>
    <polygon points="-36,-11 -9,-11 0,14" fill="#FCD34D"/>
    <!-- Core Sparkle Center -->
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Cup Stem Neck -->
  <path d="M236 315 L276 315 L268 365 L244 365 Z" fill="url(#goldReflect)"/>
  <ellipse cx="256" cy="365" rx="28" ry="6" fill="#FCD34D"/>

  <!-- Pedestal Base (Obsidian & Polished Gold Accents) -->
  <path d="M196 368 L316 368 L328 395 L184 395 Z" fill="url(#gold24k)"/>
  <rect x="170" y="395" width="172" height="38" rx="10" fill="url(#podiumGrad)" stroke="url(#goldRim)" stroke-width="2"/>

  <!-- Gold Plaque on Pedestal -->
  <rect x="194" y="405" width="124" height="18" rx="4" fill="url(#goldReflect)"/>
  <text x="256" y="418" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="900" letter-spacing="3" fill="#382103">
    EXCELLENCE
  </text>

  <!-- Brilliant Lens Flares / Sparkles -->
  <!-- Top Right Big Diamond Star -->
  <g transform="translate(372, 110)">
    <path d="M0 -22 Q1 -4 16 0 Q1 4 0 22 Q-1 4 -16 0 Q-1 -4 0 -22 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="4" fill="#FEF3C7"/>
  </g>

  <!-- Top Left Soft Star -->
  <g transform="translate(142, 130)">
    <path d="M0 -14 Q1 -3 10 0 Q1 3 0 14 Q-1 3 -10 0 Q-1 -3 0 -14 Z" fill="#FFFDF0" opacity="0.9"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Cup Highlight Star -->
  <g transform="translate(330, 270)">
    <path d="M0 -11 Q1 -2 8 0 Q1 2 0 11 Q-1 2 -8 0 Q-1 -2 0 -11 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
